name: Deploy desenvolvimento

on:
  push:
    branches:
      - desenvolvimento
  workflow_dispatch:

concurrency:
  group: deploy-desenvolvimento
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de produção
        run: npm run build

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Baixar build
        uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: dist

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: project-d429626f-5420-409e-8ec
          workload_identity_provider: projects/1010208512926/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-portal-deploy2@project-d429626f-5420-409e-8ec.iam.gserviceaccount.com

      - name: Instalar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Publicar na VM
        env:
          PROJECT: project-d429626f-5420-409e-8ec
          ZONE: us-central1-a
          INSTANCE: portal-parceiro-prototipo
        run: |
          set -euo pipefail
          tar -C dist -czf portalproduto.tar.gz .
          gcloud compute scp \
            portalproduto.tar.gz \
            deploy/nginx-portal.conf \
            deploy/publish-remote.sh \
            "${INSTANCE}:~/" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --tunnel-through-iap
          gcloud compute ssh "${INSTANCE}" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --tunnel-through-iap \
            --command="sed -i 's/\r$//' ~/publish-remote.sh && bash ~/publish-remote.sh"
